spring.application.name=campus-app

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/campus_app?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=monish885@R
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Use 'update' in dev. Switch to 'validate' + schema.sql/migrations once stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=8080
# Allows Android emulator / physical device / web frontend to reach the API
server.address=0.0.0.0

# ---- JWT ----
# Generate your own 256-bit+ secret for production, e.g.: openssl rand -base64 64
app.jwt.secret=u5ZORGX2IlzqDGjHMpGmypeRDKkiZITleOmZd5XlO4iKfP2OhjYuU/uyz5oazO48lhtMc+oozyBhNxp5a4m5eQ==
app.jwt.access-token-expiry-ms=3600000
app.jwt.refresh-token-expiry-ms=604800000

# ---- OTP ----
app.otp.length=6
app.otp.expiry-seconds=300

# ---- CORS ----
app.cors.allowed-origins=http://localhost:8081,http://localhost:19006,http://localhost:5173
